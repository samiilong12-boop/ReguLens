name: Phase 1 CI Verification

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-phase1-rls:
    name: PostgreSQL 16 & Tenant RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_temp_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Provision database roles and schema ownership
        env:
          PGPASSWORD: ci_temp_postgres_password
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -f scripts/init_db_roles.sql

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --extra dev

      - name: Run Alembic schema migrations
        working-directory: apps/api
        env:
          DATABASE_MIGRATION_URL: "postgresql+asyncpg://regulens_migrator:CHANGE_MIGRATOR_PASSWORD_HERE@localhost:5432/regulens_dev"
        run: uv run alembic upgrade head

      - name: Execute test suite (including PostgreSQL RLS integration tests)
        working-directory: apps/api
        env:
          CI: "true"
          DATABASE_URL: "postgresql+asyncpg://regulens_app:CHANGE_APP_PASSWORD_HERE@localhost:5432/regulens_dev"
          DATABASE_TEST_URL: "postgresql+asyncpg://regulens_app:CHANGE_APP_PASSWORD_HERE@localhost:5432/regulens_dev"
          DATABASE_ADMIN_TEST_URL: "postgresql+asyncpg://postgres:ci_temp_postgres_password@localhost:5432/regulens_dev"
        run: uv run pytest -c pyproject.toml -v -rs --junit-xml=test-results.xml ../../tests/security/test_postgres_rls.py

      - name: Verify test results and zero skipped RLS tests in CI
        if: always()
        working-directory: apps/api
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import os, sys

          report_file = 'test-results.xml'
          if not os.path.exists(report_file):
              print('CI Security Violation: JUnit XML report not found!', file=sys.stderr)
              sys.exit(1)

          tree = ET.parse(report_file)
          root = tree.getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          if suite is None:
              print('CI Security Violation: Invalid JUnit XML format, testsuite element not found!', file=sys.stderr)
              sys.exit(1)

          tests = int(suite.attrib.get('tests', 0))
          failures = int(suite.attrib.get('failures', 0))
          errors = int(suite.attrib.get('errors', 0))
          skipped = int(suite.attrib.get('skipped', 0))

          print('=== CI Test Quality Gate Summary ===')
          print(f'Executed Tests : {tests}')
          print(f'Failures       : {failures}')
          print(f'Errors         : {errors}')
          print(f'Skipped Tests  : {skipped}')

          if tests < 11:
              print(f'CI Security Violation: Executed tests count ({tests}) is below required minimum (11)!', file=sys.stderr)
              sys.exit(1)

          if skipped > 0:
              print(f'CI Security Violation: {skipped} RLS integration test(s) were skipped!', file=sys.stderr)
              sys.exit(1)

          if failures > 0 or errors > 0:
              print(f'CI Test Failure: {failures} test failure(s) and {errors} error(s) detected.', file=sys.stderr)
              sys.exit(1)

          print('Quality Gate Passed: All >=11 tests executed, 0 skipped, 0 failures.')
          "
