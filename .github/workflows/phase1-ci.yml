name: Phase 1 CI Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-phase1-rls:
    name: PostgreSQL 16 & Tenant RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_temp_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Provision database roles and schema ownership
        env:
          PGPASSWORD: ci_temp_postgres_password
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -f scripts/init_db_roles.sql

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --extra dev

      - name: Run Alembic schema migrations
        working-directory: apps/api
        env:
          DATABASE_MIGRATION_URL: "postgresql+asyncpg://regulens_migrator:CHANGE_MIGRATOR_PASSWORD_HERE@localhost:5432/regulens_dev"
        run: uv run alembic upgrade head

      - name: Execute test suite (including 10 PostgreSQL RLS integration tests)
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+asyncpg://regulens_app:CHANGE_APP_PASSWORD_HERE@localhost:5432/regulens_dev"
          DATABASE_TEST_URL: "postgresql+asyncpg://regulens_app:CHANGE_APP_PASSWORD_HERE@localhost:5432/regulens_dev"
        run: uv run pytest -v
